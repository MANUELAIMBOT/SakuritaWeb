<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAKU STORE — DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
      :root {
        --bg-dark: #040108;
        --panel-bg: #0b0612;
        --item-bg: #11091b;
        --cyan-neon: #00f0ff;
        --cyan-glow: rgba(0, 240, 255, 0.55);
        --magenta-neon: #ff00a0;
        --magenta-glow: rgba(255, 0, 160, 0.45);
        --purple-border: #221334;
        --text-gray: #8e8599;
        --gold: #ffd700;
        --success: #00ff66;
        --danger: #ff3131;
      }

      * {
        margin: 0; padding: 0;
        box-sizing: border-box;
        user-select: none; -webkit-user-select: none;
        font-family: 'Rajdhani', sans-serif;
      }

      html, body {
        background-color: var(--bg-dark);
        color: #fff; min-height: 100vh; width: 100vw;
        overflow-x: hidden;
      }

      .bg-particles {
        position: fixed; inset: 0; z-index: 1; pointer-events: none;
        background: radial-gradient(circle at 50% 30%, rgba(45, 10, 85, 0.45) 0%, transparent 80%);
      }
      .bg-particles::before, .bg-particles::after {
        content: ""; position: absolute; inset: -100px;
        background-image: 
          radial-gradient(circle, rgba(255, 255, 255, 0.35) 1.2px, transparent 1.2px),
          radial-gradient(circle, var(--cyan-neon) 1.5px, transparent 1.5px);
        background-size: 80px 80px, 130px 130px;
        opacity: 0.75; animation: cyberFloat 20s linear infinite;
      }
      .bg-particles::after {
        background-size: 60px 60px, 100px 100px; opacity: 0.4; animation: cyberFloatInverse 15s linear infinite;
      }
      @keyframes cyberFloat {
        0% { transform: translate(0, 0) rotate(0deg); opacity: 0.6; }
        50% { opacity: 0.9; }
        100% { transform: translate(-40px, -80px) rotate(3deg); opacity: 0.6; }
      }
      @keyframes cyberFloatInverse {
        0% { transform: translate(0, 0) rotate(0deg); }
        100% { transform: translate(30px, -60px) rotate(-3deg); }
      }

      .handler-navbar {
        position: fixed; top: 0; left: 0; right: 0; height: 60px;
        background: rgba(8, 4, 14, 0.96); z-index: 100;
        display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
        border-bottom: 2px solid var(--purple-border);
        box-shadow: 0 4px 20px rgba(0,0,0,0.7); backdrop-filter: blur(10px);
      }
      .navbar-left { display: flex; align-items: center; gap: 12px; }
      
      .menu-trigger {
        width: 38px; height: 38px; background: transparent;
        border: 2px solid var(--cyan-neon); border-radius: 8px;
        color: var(--cyan-neon); font-size: 1.1rem;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; box-shadow: 0 0 8px var(--cyan-glow);
      }
      .nav-title {
        font-family: 'Orbitron', sans-serif; font-weight: 900;
        font-size: 1.05rem; letter-spacing: 1px;
        background: linear-gradient(90deg, #fff, #bba3ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }

      .vault-pill {
        display: flex; align-items: center; gap: 6px;
        background: rgba(0, 240, 255, 0.05); padding: 5px 12px;
        border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 20px;
      }
      .vault-pill i { color: var(--cyan-neon); font-size: 0.85rem; filter: drop-shadow(0 0 4px var(--cyan-neon)); }
      .vault-amount { font-family: 'Orbitron'; font-size: 0.85rem; font-weight: 700; color: #fff; }

      .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 140; display: none; backdrop-filter: blur(4px); }
      .drawer-overlay.show { display: block; }

      .side-drawer {
        position: fixed; top: 0; left: -270px; width: 270px; height: 100vh;
        background: var(--panel-bg); z-index: 150; border-right: 3px solid var(--cyan-neon);
        box-shadow: 5px 0 30px rgba(0,0,0,0.9); padding: 15px 12px 20px;
        display: flex; flex-direction: column; gap: 12px;
        transition: left 0.35s cubic-bezier(0.1, 0.9, 0.2, 1); overflow-y: auto;
      }
      .side-drawer.open { left: 0; }

      .user-identity-zone { display: flex; align-items: center; gap: 12px; padding: 4px; }
      .user-avatar-glow {
        width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--cyan-neon); box-shadow: 0 0 10px var(--cyan-glow);
        display: flex; align-items: center; justify-content: center; color: var(--cyan-neon); font-size: 1.15rem; background: rgba(0, 240, 255, 0.05);
      }
      .user-profile-name { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.1rem; color: #fff; }

      .money-vault-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .vault-box { background: var(--item-bg); border-radius: 8px; padding: 12px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .vault-box i { font-size: 1.2rem; }
      .vault-box .v-title { font-size: 0.65rem; font-weight: 700; color: var(--text-gray); }
      .vault-box .v-num { font-family: 'Orbitron'; font-size: 1.05rem; font-weight: 900; }
      .vault-box.primary-wallet { border: 1.5px solid rgba(0, 240, 255, 0.2); }
      .vault-box.primary-wallet i, .vault-box.primary-wallet .v-num { color: var(--cyan-neon); text-shadow: 0 0 8px var(--cyan-glow); }
      .vault-box.bonus-wallet { border: 1.5px solid rgba(255, 0, 160, 0.2); }
      .vault-box.bonus-wallet i, .vault-box.bonus-wallet .v-num { color: var(--magenta-neon); text-shadow: 0 0 8px var(--magenta-glow); }

      .nav-dropdown-wrapper { display: flex; flex-direction: column; width: 100%; }
      .nav-dropdown-trigger { width: 100%; padding: 12px; background: #150d21; border-radius: 8px; border: 1px solid var(--purple-border); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
      .trigger-left-block { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.85rem; }
      .trigger-left-block i { color: var(--cyan-neon); }
      .nav-dropdown-trigger .arrow-icon { color: var(--magenta-neon); font-size: 0.75rem; transition: transform 0.3s; }
      .nav-dropdown-wrapper.open .nav-dropdown-trigger .arrow-icon { transform: rotate(180deg); }
      .dropdown-slidable-menu { max-height: 0; overflow: hidden; transition: max-height 0.4s cubic-bezier(0, 1, 0, 1); display: flex; flex-direction: column; gap: 8px; }
      .nav-dropdown-wrapper.open .dropdown-slidable-menu { max-height: 1000px; transition: max-height 0.4s cubic-bezier(1, 0, 1, 0); margin-top: 8px; }

      .sub-accordion { display: flex; flex-direction: column; width: 100%; }
      .sub-acc-header { width: 100%; padding: 10px; background: var(--item-bg); border: 1px solid rgba(255,255,255,0.01); border-radius: 8px; display: flex; align-items: center; justify-content: space-between; color: rgba(255,255,255,0.85); font-size: 0.88rem; font-weight: 600; cursor: pointer; }
      .sub-acc-header-left { display: flex; align-items: center; gap: 10px; }
      .circle-box { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--cyan-neon); box-shadow: 0 0 8px var(--cyan-glow); color: var(--cyan-neon); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; background: rgba(0, 240, 255, 0.03); }
      .sub-acc-header i.indicator-arrow { font-size: 0.7rem; color: rgba(255,255,255,0.3); transition: transform 0.3s; }
      .sub-accordion.active .sub-acc-header { border-color: rgba(0,240,255,0.25); background: rgba(0,240,255,0.01); }
      .sub-accordion.active .sub-acc-header i.indicator-arrow { transform: rotate(180deg); color: var(--cyan-neon); }
      .sub-acc-content { max-height: 0; overflow: hidden; transition: max-height 0.3s cubic-bezier(0, 1, 0, 1); display: flex; flex-direction: column; gap: 6px; padding-left: 6px; }
      .sub-accordion.active .sub-acc-content { max-height: 250px; transition: max-height 0.3s cubic-bezier(1, 0, 1, 0); margin-top: 6px; }

      .leaf-item { width: 100%; padding: 10px; background: #130a1f; border: 1px solid rgba(0, 240, 255, 0.15); border-radius: 8px; display: flex; align-items: center; justify-content: space-between; color: rgba(255,255,255,0.75); font-size: 0.85rem; font-weight: 600; text-decoration: none; cursor: pointer; }
      .leaf-item-left { display: flex; align-items: center; gap: 10px; }
      .leaf-item:active, .leaf-item.active-filter { border-color: var(--cyan-neon); background: rgba(0, 240, 255, 0.08); color: #fff; }
      .leaf-item::after { content: '→'; font-size: 0.85rem; color: rgba(255,255,255,0.25); }

      .logout-action-box { margin-top: auto; padding: 12px; background: rgba(255, 0, 80, 0.02); border: 1.5px solid rgba(255, 0, 80, 0.2); border-radius: 8px; display: flex; align-items: center; gap: 12px; color: #ff527b; font-weight: 700; font-size: 0.88rem; cursor: pointer; }
      .logout-action-box i { width: 30px; height: 30px; border-radius: 8px; background: rgba(255, 0, 80, 0.05); border: 1px solid rgba(255, 0, 80, 0.25); color: #ff0050; display: flex; align-items: center; justify-content: center; }

      .workspace-core {
        position: relative; z-index: 10; padding: 80px 16px 30px;
        width: 100%; max-width: 460px; margin: 0 auto;
        display: flex; flex-direction: column; gap: 16px;
      }
      
      .current-section-title {
        font-family: 'Orbitron'; font-size: 0.95rem; font-weight: 900;
        color: var(--cyan-neon); letter-spacing: 2px; text-transform: uppercase;
        border-left: 3px solid var(--magenta-neon); padding-left: 10px; margin-bottom: 4px;
      }

      .cards-grid-layout {
        display: flex; flex-direction: column; gap: 16px; width: 100%;
      }

      .product-cyber-card {
        background: rgba(11, 6, 18, 0.9); border: 1.5px solid var(--purple-border);
        border-radius: 12px; overflow: hidden; transition: border-color 0.3s;
        display: flex; flex-direction: column; position: relative;
      }
      .product-cyber-card::before {
        content: ''; position: absolute; top: 0; left: 0; width: 12px; height: 12px;
        border-top: 2px solid var(--cyan-neon); border-left: 2px solid var(--cyan-neon);
      }
      .card-banner-img {
        width: 100%; height: 150px; object-fit: cover;
        border-bottom: 1px solid var(--purple-border); background: #130a22;
      }
      .card-body-details { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
      
      .product-meta-row { display: flex; justify-content: space-between; align-items: center; }
      .product-title-text { font-family: 'Orbitron'; font-weight: 700; font-size: 1.1rem; color: #fff; }
      .product-category-tag { font-size: 0.65rem; font-weight: 900; background: rgba(255, 0, 160, 0.15); color: var(--magenta-neon); border: 1px solid rgba(255, 0, 160, 0.3); padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-family: 'Orbitron'; }
      
      .product-description { font-size: 0.85rem; color: var(--text-gray); line-height: 1.4; }
      
      .duration-selector-box {
        display: flex; flex-direction: column; gap: 4px; margin-top: 4px;
      }
      .duration-selector-box label { font-size: 0.72rem; font-weight: 700; color: var(--text-gray); }
      .cyber-select {
        background: #140b24; border: 1px solid var(--purple-border); border-radius: 6px;
        color: #fff; padding: 8px; font-size: 0.88rem; font-weight: 600; outline: none;
        cursor: pointer; width: 100%; transition: border-color 0.2s;
      }
      .cyber-select:focus { border-color: var(--cyan-neon); }

      .card-action-bar {
        display: flex; justify-content: space-between; align-items: center; margin-top: 8px;
        padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.06);
      }
      .price-stack { display: flex; flex-direction: column; }
      .old-crossed-price { font-size: 0.75rem; color: var(--danger); text-decoration: line-through; font-weight: 600; font-family: 'Orbitron'; }
      .current-live-price { font-family: 'Orbitron'; font-size: 1.2rem; font-weight: 900; color: var(--success); text-shadow: 0 0 6px rgba(0,255,102,0.3); }
      
      .btn-cyber-buy {
        background: rgba(0, 240, 255, 0.08); border: 1px solid var(--cyan-neon);
        color: var(--cyan-neon); font-family: 'Orbitron'; font-weight: 700; font-size: 0.8rem;
        padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: all 0.2s;
        box-shadow: 0 0 8px rgba(0,240,255,0.1);
      }
      .btn-cyber-buy:active { transform: scale(0.95); background: var(--cyan-neon); color: #000; box-shadow: 0 0 15px var(--cyan-neon); }

      .cyber-modal-container {
        position: fixed; inset: 0; background: rgba(4, 1, 8, 0.94); z-index: 300;
        display: none; align-items: center; justify-content: center; padding: 20px;
        backdrop-filter: blur(6px);
      }
      .cyber-modal-container.show { display: flex; }
      .modal-frame {
        background: var(--panel-bg); border: 2px solid var(--purple-border); border-radius: 14px;
        padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        position: relative; display: flex; flex-direction: column; gap: 14px;
      }
      .modal-frame::after { content:''; position:absolute; bottom:0; right:0; width:15px; height:15px; border-bottom:3px solid var(--magenta-neon); border-right:3px solid var(--magenta-neon); }
      .modal-icon-center { font-size: 2.8rem; text-align: center; margin: 4px 0; }
      .modal-icon-center.success { color: var(--success); filter: drop-shadow(0 0 8px var(--success)); }
      .modal-icon-center.error { color: var(--danger); filter: drop-shadow(0 0 8px var(--danger)); }
      .modal-icon-center.confirm { color: var(--gold); filter: drop-shadow(0 0 8px var(--gold)); }
      .modal-title-main { font-family: 'Orbitron'; font-weight: 900; font-size: 1.15rem; text-align: center; letter-spacing: 1px; }
      
      .order-receipt-box {
        background: #120a1c; border: 1px dashed var(--purple-border); border-radius: 8px; padding: 12px;
        display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem;
      }
      .receipt-item-row { display: flex; justify-content: space-between; }
      .receipt-item-row span:first-child { color: var(--text-gray); font-weight: 600; }
      .receipt-item-row span:last-child { font-weight: 700; color: #fff; }

      .btn-modal-action { width: 100%; padding: 12px; border-radius: 8px; border: none; font-family: 'Orbitron'; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: transform 0.2s; }
      .btn-modal-action.primary { background: var(--cyan-neon); color: #000; box-shadow: 0 0 10px var(--cyan-glow); }
      .btn-modal-action.danger { background: var(--danger); color: #fff; }
      .btn-modal-action:active { transform: scale(0.96); }

      .no-products-alert { font-size: 0.9rem; color: var(--text-gray); text-align: center; padding: 30px 10px; width: 100%; background: rgba(255,255,255,0.01); border-radius: 8px; border: 1px dashed var(--purple-border); }
    </style>
  </head>
  <body>
    <div class="bg-particles"></div>
    <div class="drawer-overlay" id="overlay"></div>

    <header class="handler-navbar">
      <div class="navbar-left">
        <button class="menu-trigger" id="btnOpen">
          <i class="fas fa-bars"></i>
        </button>
        <span class="nav-title" onclick="loadSection('home')">SAKU STORE</span>
      </div>
      <div class="navbar-right">
        <div class="vault-pill">
          <i class="fas fa-coins"></i>
          <span class="vault-amount" id="topNavBalance">$0.00</span>
        </div>
      </div>
    </header>

    <nav class="side-drawer" id="drawer">
      <div class="user-identity-zone">
        <div class="user-avatar-glow">
          <i class="fas fa-robot"></i>
        </div>
        <span class="user-profile-name" id="drawerUsername">Cargando...</span>
      </div>

      <div class="money-vault-row">
        <div class="vault-box primary-wallet">
          <i class="fas fa-wallet"></i>
          <span class="v-title">SALDO PRINCIPAL</span>
          <span class="v-num" id="walletPrincipal">$0.00</span>
        </div>
        <div class="vault-box bonus-wallet">
          <i class="fas fa-gift"></i>
          <span class="v-title">SALDO BONUS</span>
          <span class="v-num" id="walletBonus">$0.00</span>
        </div>
      </div>

      <div class="nav-dropdown-wrapper open" id="navDropdown">
        <div class="nav-dropdown-trigger" onclick="toggleNavigationMenu()">
          <div class="trigger-left-block">
            <i class="fas fa-compass"></i> NAVEGACIÓN
          </div>
          <i class="fas fa-chevron-down arrow-icon"></i>
        </div>

        <div class="dropdown-slidable-menu">
          
          <div class="sub-accordion">
            <div class="sub-acc-header">
              <div class="sub-acc-header-left">
                <div class="circle-box"><i class="fas fa-user-shield"></i></div>
                <span>Perfil</span>
              </div>
              <i class="fas fa-chevron-down indicator-arrow"></i>
            </div>
            <div class="sub-acc-content">
              <a class="leaf-item" onclick="window.location.href='perfil.html'">
                <div class="leaf-item-left">
                  <div class="circle-box" style="width:30px; height:30px; font-size:0.75rem;"><i class="fas fa-id-card"></i></div>
                  <span>Mi Ficha / Cuenta</span>
                </div>
              </a>
            </div>
          </div>

          <div class="sub-accordion">
            <div class="sub-acc-header">
              <div class="sub-acc-header-left">
                <div class="circle-box"><i class="fas fa-key"></i></div>
                <span>Zona de Keys</span>
              </div>
              <i class="fas fa-chevron-down indicator-arrow"></i>
            </div>
            <div class="sub-acc-content">
              <a class="leaf-item" id="filter-root" onclick="loadSection('root', this)">
                <div class="leaf-item-left">
                  <div class="circle-box" style="width:30px; height:30px; font-size:0.75rem;"><i class="fas fa-terminal"></i></div>
                  <span>Root</span>
                </div>
              </a>
              <a class="leaf-item" id="filter-noroot" onclick="loadSection('no_root', this)">
                <div class="leaf-item-left">
                  <div class="circle-box" style="width:30px; height:30px; font-size:0.75rem;"><i class="fas fa-mobile-alt"></i></div>
                  <span>No Root</span>
                </div>
              </a>
            </div>
          </div>

          <div class="sub-accordion">
            <div class="sub-acc-header">
              <div class="sub-acc-header-left">
                <div class="circle-box"><i class="fas fa-server"></i></div>
                <span>Sección de Proxys</span>
              </div>
              <i class="fas fa-chevron-down indicator-arrow"></i>
            </div>
            <div class="sub-acc-content">
              <a class="leaf-item" id="filter-proxy-android" onclick="loadSection('proxy_android', this)">
                <div class="leaf-item-left">
                  <div class="circle-box" style="width:30px; height:30px; font-size:0.75rem;"><i class="fab fa-android"></i></div>
                  <span>Android</span>
                </div>
              </a>
              <a class="leaf-item" id="filter-proxy-ios" onclick="loadSection('proxy_ios', this)">
                <div class="leaf-item-left">
                  <div class="circle-box" style="width:30px; height:30px; font-size:0.75rem;"><i class="fab fa-apple"></i></div>
                  <span>iPhone / iOS</span>
                </div>
              </a>
            </div>
          </div>

          <div class="sub-accordion">
            <div class="sub-acc-header">
              <div class="sub-acc-header-left">
                <div class="circle-box"><i class="fas fa-trophy"></i></div>
                <span>Ranking</span>
              </div>
              <i class="fas fa-chevron-down indicator-arrow"></i>
            </div>
            <div class="sub-acc-content">
              <a class="leaf-item" onclick="window.location.href='perfil.html'">
                <div class="leaf-item-left">
                  <div class="circle-box" style="width:30px; height:30px; font-size:0.75rem;"><i class="fas fa-medal"></i></div>
                  <span>Mi Rango Tienda</span>
                </div>
              </a>
            </div>
          </div>

        </div>
      </div>

      <div class="logout-action-box" onclick="cerrarSesionSaku()">
        <i class="fas fa-sign-out-alt"></i> CERRAR SESIÓN
      </div>
    </nav>

    <main class="workspace-core">
      <h2 class="current-section-title" id="sectionCoreTitle">SERVICIOS DISPONIBLES</h2>
      
      <div class="cards-grid-layout" id="catalogCardsContainer">
        <p class="no-products-alert">Conectando con el servidor cuántico...</p>
      </div>
    </main>

    <div class="cyber-modal-container" id="sakuGlobalModal">
      <div class="modal-frame" id="modalFrameContent"></div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyB-J-8BUFhnDcZIEvYRNq6UAFaPcgxuAtE",
        authDomain: "saku-store.firebaseapp.com",

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      let currentUserCache = null;
      let currentDiscountMultiplier = 1;
      let fullProductsDatabase = [];
      let activeCategoryFilter = "home";

      const TABLA_DESCUENTOS = {

        diamante: 12,
        socio: 15,
        nivel_supremo: 20,
        creador: 30,
        sakurita: 50
      };

      const btnOpen = document.getElementById('btnOpen');
      const drawer = document.getElementById('drawer');
      const overlay = document.getElementById('overlay');
      const navDropdown = document.getElementById('navDropdown');

      function toggleDrawer() {
        drawer.classList.toggle('open');
        overlay.classList.toggle('show');
      }
      btnOpen.addEventListener('click', toggleDrawer);
      overlay.addEventListener('click', toggleDrawer);

      function toggleNavigationMenu() {
        navDropdown.classList.toggle('open');
      }

      document.querySelectorAll('.sub-acc-header').forEach(header => {
        header.addEventListener('click', () => {
          const accordion = header.parentElement;
          document.querySelectorAll('.sub-accordion').forEach(item => {
            if (item !== accordion) item.classList.remove('active');
          });
          accordion.classList.toggle('active');
        });
      });

      // ✅ REDIRECCIÓN A index.html SI NO HAY SESIÓN ACTIVA Y FILTRO DE EXISTENCIA DE DOCUMENTO
      firebase.auth().onAuthStateChanged((user) => {
        if (user) {
          escucharDatosUsuario(user.uid);
        } else {
          window.location.href = "index.html";
        }
      });

      let catalogoInicializado = false;

      function escucharDatosUsuario(uid) {
        db.collection('usuarios').doc(uid).onSnapshot((doc) => {
          if (!doc.exists) {
            // Si el token de autenticación es válido pero el documento no existe en la BD, se expulsa inmediatamente
            firebase.auth().signOut().then(() => {
              window.location.href = "index.html";
            });
            return;
          }
          currentUserCache = doc.data();
          currentUserCache.uid = uid;

          document.getElementById('drawerUsername').innerText = currentUserCache.username || "Usuario";
          const principal = currentUserCache.saldo_principal || 0;
          const bonus = currentUserCache.saldo_bonus || 0;
          const totalSaldo = principal + bonus;

          document.getElementById('topNavBalance').innerText = `$${totalSaldo.toFixed(2)}`;
          document.getElementById('walletPrincipal').innerText = `$${principal.toFixed(2)}`;
          document.getElementById('walletBonus').innerText = `$${bonus.toFixed(2)}`;

          const rangoUser = currentUserCache.rango_manual || obtenerRangoPorDinero(currentUserCache.total_recargado || 0);
          const pctDesc = TABLA_DESCUENTOS[rangoUser] || 0;
          currentDiscountMultiplier = (100 - pctDesc) / 100;

          if (!catalogoInicializado) {
            catalogoInicializado = true;
            cargarCatalogoUnaVez();
          } else {
            renderizarCatalogoFiltrado();
          }
        }, (error) => {
          window.location.href = "index.html";
        });
      }

      function obtenerRangoPorDinero(gasto) {
        if (gasto >= 250) return "nivel_supremo";
        if (gasto >= 100) return "diamante";
        if (gasto >= 50) return "oro";
        if (gasto >= 10) return "bronce";
        return "cliente_verificado";
      }

      function cargarCatalogoUnaVez() {
        const container = document.getElementById('catalogCardsContainer');
        container.innerHTML = `<p class="no-products-alert"><i class="fas fa-spinner fa-spin"></i> Cargando catálogo...</p>`;

        db.collection('productos').get().then((snapshot) => {
          fullProductsDatabase = [];
          snapshot.forEach(doc => {
            let data = doc.data();
            data.id = doc.id;
            fullProductsDatabase.push(data);
          });
          renderizarCatalogoFiltrado();
        }).catch(err => {
          container.innerHTML = `<p class="no-products-alert" style="color:#ff4444;"><i class="fas fa-exclamation-triangle"></i> Error al cargar productos: ${err.message}</p>`;
        });
      }

      function loadSection(categoryKey, elementBtn = null) {
        activeCategoryFilter = categoryKey;
        
        document.querySelectorAll('.leaf-item').forEach(i => i.classList.remove('active-filter'));
        if (elementBtn) elementBtn.classList.add('active-filter');

        drawer.classList.remove('open');
        overlay.classList.remove('show');

        const tMap = {
          home: "SERVICIOS DISPONIBLES",
          root: "ZONA KEYS — ROOT",
          no_root: "ZONA KEYS — NO ROOT",
          proxy_android: "PROXYS — ANDROID",
          proxy_ios: "PROXYS — iPHONE iOS"
        };
        document.getElementById('sectionCoreTitle').innerText = tMap[categoryKey] || "CATÁLOGO";

        renderizarCatalogoFiltrado();
      }

      function renderizarCatalogoFiltrado() {
        const container = document.getElementById('catalogCardsContainer');
        container.innerHTML = "";

        let listaFiltrada = [];

        if (activeCategoryFilter === "home") {
          listaFiltrada = [...fullProductsDatabase];
        } else {
          listaFiltrada = fullProductsDatabase.filter(p => p.categoria === activeCategoryFilter);
        }

        if (listaFiltrada.length === 0) {
          container.innerHTML = `<p class="no-products-alert">No hay productos cargados en este apartado aún.</p>`;
          return;
        }

        listaFiltrada.forEach(prod => {
          const cardHtml = generarEstructuraCard(prod);
          container.appendChild(cardHtml);
        });
      }

      function generarEstructuraCard(p) {
        const div = document.createElement('div');
        div.className = "product-cyber-card";
        
        let selectorDiasHtml = "";
        let precioBase = 0;

        if (p.tipo === "key" && p.precios_variaciones) {
          precioBase = p.precios_variaciones.dia_1 || p.precio || 0;
          selectorDiasHtml = `
            <div class="duration-selector-box">
              <label><i class="fas fa-stopwatch"></i> SELECCIONAR TIEMPO:</label>
              <select class="cyber-select" onchange="calcularPrecioCardDinamico(this, '${p.id}')">
                <option value="dia_1" data-raw="${p.precios_variaciones.dia_1}">1 Día Suscripción</option>
                ${p.precios_variaciones.dia_7 ? `<option value="dia_7" data-raw="${p.precios_variaciones.dia_7}">7 Días Suscripción</option>` : ''}
                ${p.precios_variaciones.dia_30 ? `<option value="dia_30" data-raw="${p.precios_variaciones.dia_30}">30 Días Suscripción</option>` : ''}
                ${p.precios_variaciones.permanente ? `<option value="permanente" data-raw="${p.precios_variaciones.permanente}">Pase Permanente</option>` : ''}
              </select>
            </div>
          `;
        } else {
          precioBase = p.precio || 0;
        }

        const precioConDescuento = precioBase * currentDiscountMultiplier;
        const tieneDescuento = currentDiscountMultiplier < 1;

        div.innerHTML = `
          <img src="${p.imagen_url || 'https://i.imgur.com/v2Z2vX3.png'}" class="card-banner-img" alt="Saku Product">
          <div class="card-body-details">
            <div class="product-meta-row">
              <h3 class="product-title-text">${p.nombre}</h3>
              <span class="product-category-tag">${p.categoria.replace('_',' ')}</span>
            </div>
            <p class="product-description">${p.descripcion || 'Sin descripción detallada por el momento.'}</p>
            
            ${selectorDiasHtml}

            <div class="card-action-bar">
              <div class="price-stack" id="priceStack-${p.id}">
                ${tieneDescuento ? `<span class="old-crossed-price">$${precioBase.toFixed(2)}</span>` : ''}
                <span class="current-live-price" data-actual="${precioConDescuento}">$${precioConDescuento.toFixed(2)}</span>
              </div>
              <button class="btn-cyber-buy" onclick="procesarIntencionCompra('${p.id}', '${p.tipo === 'key' ? 'dia_1' : 'directo'}')">
                <i class="fas fa-shopping-cart"></i> COMPRAR
              </button>
            </div>
          </div>
        `;
        return div;
      }

      function calcularPrecioCardDinamico(selectElem, productId) {
        const optionSelected = selectElem.options[selectElem.selectedIndex];
        const precioBase = parseFloat(optionSelected.getAttribute('data-raw')) || 0;
        
        const precioConDescuento = precioBase * currentDiscountMultiplier;
        const tieneDescuento = currentDiscountMultiplier < 1;

        const stack = document.getElementById(`priceStack-${productId}`);
        stack.innerHTML = `
          ${tieneDescuento ? `<span class="old-crossed-price">$${precioBase.toFixed(2)}</span>` : ''}
          <span class="current-live-price" data-actual="${precioConDescuento}">$${precioConDescuento.toFixed(2)}</span>
        `;

        const cardBtn = selectElem.closest('.card-body-details').querySelector('.btn-cyber-buy');
        cardBtn.setAttribute('onclick', `procesarIntencionCompra('${productId}', '${selectElem.value}')`);
      }

      function procesarIntencionCompra(productId, variacionSeleccionada) {
        const prod = fullProductsDatabase.find(p => p.id === productId);
        if (!prod || !currentUserCache) return;

        let precioBase = prod.precio || 0;
        if (prod.tipo === "key" && prod.precios_variaciones) {
          precioBase = prod.precios_variaciones[variacionSeleccionada] || prod.precio || 0;
        }

        const costeFinal = precioBase * currentDiscountMultiplier;
        const saldoPrincipal = currentUserCache.saldo_principal || 0;
        const saldoBonus = currentUserCache.saldo_bonus || 0;
        const saldoTotal = saldoPrincipal + saldoBonus;

        const modal = document.getElementById('sakuGlobalModal');
        const frame = document.getElementById('modalFrameContent');

        if (saldoTotal < costeFinal) {
          frame.innerHTML = `
            <div class="modal-icon-center error"><i class="fas fa-times-circle"></i></div>
            <h3 class="modal-title-main">SALDO INSUFICIENTE</h3>
            <p style="font-size:0.88rem; text-align:center; color:var(--text-gray);">No dispones de suficientes créditos para adquirir este servicio.</p>
            <div class="order-receipt-box">
              <div class="receipt-item-row"><span>Costo Neto:</span><span>$${costeFinal.toFixed(2)}</span></div>
              <div class="receipt-item-row"><span>Tu Saldo:</span><span style="color:var(--danger);">$${saldoTotal.toFixed(2)}</span></div>
            </div>
            <button class="btn-modal-action danger" onclick="cerrarSakuModal()">CERRAR VENTANA</button>
          `;
        } else {
          frame.innerHTML = `
            <div class="modal-icon-center confirm"><i class="fas fa-exclamation-triangle"></i></div>
            <h3 class="modal-title-main">CONFIRMAR ORDEN</h3>
            <p style="font-size:0.85rem; text-align:center; color:var(--text-gray);">¿Deseas procesar la facturación de esta orden en Saku Store?</p>
            <div class="order-receipt-box">
              <div class="receipt-item-row"><span>Producto:</span><span>${prod.nombre}</span></div>
              <div class="receipt-item-row"><span>Variación:</span><span style="text-transform:uppercase; color:var(--cyan-neon);">${variacionSeleccionada.replace('_',' ')}</span></div>
              <div class="receipt-item-row"><span>Total a Debitar:</span><span style="color:var(--success);">$${costeFinal.toFixed(2)}</span></div>
            </div>
            <button class="btn-modal-action primary" id="btnConfirmDebit">PROCESAR DÉBITO</button>
            <button class="btn-modal-action" style="background:transparent; color:var(--text-gray);" onclick="cerrarSakuModal()">CANCELAR</button>
          `;

          document.getElementById('btnConfirmDebit').onclick = () => executionFinalDebito(prod, variacionSeleccionada, costeFinal);
        }

        modal.classList.add('show');
      }

      function executionFinalDebito(prod, variacion, coste) {
        const uid = currentUserCache.uid;
        let walletP = currentUserCache.saldo_principal || 0;
        let walletB = currentUserCache.saldo_bonus || 0;
        let costoRestante = coste;

        if (walletB >= costoRestante) {
          walletB -= costoRestante;
          costoRestante = 0;
        } else {
          costoRestante -= walletB;
          walletB = 0;
          walletP -= costoRestante;
        }

        const frame = document.getElementById('modalFrameContent');
        frame.innerHTML = `<div style="text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin" style="color:var(--cyan-neon);font-size:2rem;"></i><p style="margin-top:12px;color:var(--text-gray);font-size:0.85rem;">Procesando transacción...</p></div>`;

        const userRef = db.collection('usuarios').doc(uid);
        const fechaHoy = new Date().toLocaleString('es-ES');

        const obtenerKey = () => {
          if (prod.tipo !== 'key') return Promise.resolve(null);
          return db.collection('productos').doc(prod.id)
            .collection('keys_stock')
            .where('usada', '==', false)
            .limit(1)
            .get()
            .then(snap => {
              if (snap.empty) throw new Error('Sin stock disponible. Contacta al administrador.');
              return snap.docs[0];
            });
        };

        obtenerKey().then(keyDoc => {
          const batch = db.batch();

          batch.update(userRef, {
            saldo_principal: walletP,
            saldo_bonus: walletB,
            total_recargado: (currentUserCache.total_recargado || 0)
          });

          let entregaTexto;
          if (prod.tipo === 'key' && keyDoc) {
            const keyReal = keyDoc.data().key;
            entregaTexto = keyReal;
            batch.update(keyDoc.ref, { usada: true, usada_por: uid, usada_en: fechaHoy });
            
            const compraRef = userRef.collection('compras').doc();
            batch.set(compraRef, {
              producto: prod.nombre,
              precio: coste,
              fecha: fechaHoy,
              detalles: `Licencia: ${keyReal} (${variacion.replace(/_/g,' ')})`
            });
          } else {
            entregaTexto = 'SERVICIO EN ESPERA DE ACTIVACIÓN MANUAL';
            const compraRef = userRef.collection('compras').doc();
            batch.set(compraRef, {
              producto: prod.nombre,
              precio: coste,
              fecha: fechaHoy,
              detalles: 'Activación en proceso por moderador'
            });
          }

          return batch.commit().then(() => entregaTexto);
        }).then(entregaTexto => {
          if (prod.tipo === 'key' && entregaTexto !== 'SERVICIO EN ESPERA DE ACTIVACIÓN MANUAL') {
            try { navigator.clipboard.writeText(entregaTexto); } catch(e) {}
          }
          currentUserCache.saldo_principal = walletP;
          currentUserCache.saldo_bonus = walletB;

          frame.innerHTML = `
            <div class="modal-icon-center success"><i class="fas fa-check-circle"></i></div>
            <h3 class="modal-title-main">ORDEN PROCESADA</h3>
            <p style="font-size:0.85rem; text-align:center; color:var(--text-gray);">Pago validado correctamente.</p>
            <div class="order-receipt-box">
              <div class="receipt-item-row"><span style="color:var(--success);">ENTREGA:</span><span style="word-break:break-all; font-family:monospace; font-size:0.85rem; color:var(--cyan-neon);">${entregaTexto}</span></div>
            </div>
            ${prod.tipo === 'key' ? '<p style="font-size:0.75rem; text-align:center; color:var(--gold);"><i class="fas fa-copy"></i> ¡Licencia copiada al portapapeles!</p>' : ''}
            <button class="btn-modal-action primary" onclick="cerrarSakuModal()">ENTENDIDO</button>
          `;
        }).catch(err => {
          frame.innerHTML = `
            <div class="modal-icon-center error"><i class="fas fa-times-circle"></i></div>
            <h3 class="modal-title-main">ERROR</h3>
            <p style="font-size:0.85rem; text-align:center; color:var(--text-gray);">${err.message}</p>
            <button class="btn-modal-action danger" onclick="cerrarSakuModal()">CERRAR</button>
          `;
        });
      }

      function cerrarSakuModal() {
        document.getElementById('sakuGlobalModal').classList.remove('show');
      }

      function cerrarSesionSaku() {
        firebase.auth().signOut().then(() => {
          window.location.href = "index.html";
        });
      }
    </script>
  </body>
</html>
